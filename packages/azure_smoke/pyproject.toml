[project]
name = "example-model-azure-smoke"
version = "0.1.0"
description = "Small Azure Batch smoke test for cfa-calibration-tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["calibrationtools[azure]", "example-model"]

[project.scripts]
example-model-azure-smoke = "example_model_azure_smoke.run:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
calibrationtools = { workspace = true }
example-model = { workspace = true }
